name: Secure API CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE_DIR: .ci-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: mkdir -p .ci-reports
      - name: Automated tests
        run: python -m pytest -v --junitxml=.ci-reports/pytest.xml
      - name: Real HTTP tests with curl
        run: python scripts/curl_smoke.py
      - name: Bandit SAST
        if: ${{ !cancelled() }}
        run: bandit -r secure_api -f json -o .ci-reports/bandit.json
      - name: Supplementary Python dependency audit
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt -f json -o .ci-reports/pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-and-sast-reports
          path: |
            .ci-reports/pytest.xml
            .ci-reports/curl.json
            .ci-reports/bandit.json
            .ci-reports/pip-audit.json
  dependency-check:
    runs-on: ubuntu-latest
    # The first NVD sync downloads ~410k CVE records and can take over an hour;
    # later runs are incremental from the saved cache.
    timeout-minutes: 300
    env:
      # This workflow requires the NVD_API_KEY repository secret for NVD updates.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the exact runtime dependency artifacts
        run: python -m pip download -r requirements.txt --dest .scan-packages
      - name: Install OWASP Dependency-Check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/dc.zip" https://github.com/dependency-check/DependencyCheck/releases/download/v13.0.0/dependency-check-13.0.0-release.zip
          unzip -q "$RUNNER_TEMP/dc.zip" -d "$RUNNER_TEMP/dc"
      - name: Restore Dependency-Check NVD data
        uses: actions/cache/restore@v4
        with:
          path: .dependency-check-data
          key: dc-13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dc-13-${{ runner.os }}-
      - name: OWASP Dependency-Check SCA
        shell: bash
        run: |
          set -euo pipefail
          # Fail with a readable message instead of a tool-level NvdApiException
          # when the repository secret has not been configured.
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "::error::NVD_API_KEY is empty. Add the repository secret NVD_API_KEY."
            exit 1
          fi
          mkdir -p .ci-reports/dependency-check
          set +e
          "$RUNNER_TEMP/dc/dependency-check/bin/dependency-check.sh" \
            --project secure-api-lab --scan .scan-packages \
            --enableExperimental --disableOssIndex \
            --nvdApiKey "$NVD_API_KEY" \
            --data .dependency-check-data --out .ci-reports/dependency-check \
            --suppression dependency-check-suppressions.xml \
            --format HTML --format JSON --failOnCVSS 7 2>&1 | tee .ci-reports/dependency-check/dc.log
          pipeline_status=("${PIPESTATUS[@]}")
          status=${pipeline_status[0]}
          if [ "$status" -eq 0 ] && [ "${pipeline_status[1]}" -ne 0 ]; then
            status=${pipeline_status[1]}
          fi
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Dependency-Check failed with exit code $status. See the live log and owasp-dependency-check-reports artifact."
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-reports
          path: .ci-reports/dependency-check/
          if-no-files-found: warn
      - name: Summarise Dependency-Check findings
        if: always()
        shell: bash
        run: |
          report=.ci-reports/dependency-check/dependency-check-report.json
          if [ ! -f "$report" ]; then
            echo "No Dependency-Check report was produced."
            exit 0
          fi
          python - "$report" <<'PY'
          import json, sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          deps = data.get("dependencies", [])
          total = 0
          for dep in deps:
              for v in dep.get("vulnerabilities", []):
                  total += 1
                  name = dep.get("fileName") or dep.get("filePath") or "?"
                  sev = v.get("severity", "?")
                  score = (v.get("cvssv3") or {}).get("baseScore") \
                          or (v.get("cvssv2") or {}).get("score") or "?"
                  if total <= 10:
                      print(f"::warning::{name}: {v.get('name')} "
                            f"severity={sev} score={score}")
          print(f"Dependency-Check: {len(deps)} dependencies analysed, "
                f"{total} vulnerability findings.")
          if total:
              print("::warning::Dependency-Check reported "
                    f"{total} findings; triage, fix or suppress with justification.")
          PY
      # actions/cache only saves on success, which discarded a fully synced NVD
      # database whenever the scan gate failed, forcing a full ~410k-record
      # re-download on every attempt. Save unconditionally instead: a partially
      # synced database still lets the next run resume instead of restarting.
      - name: Save Dependency-Check NVD data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .dependency-check-data
          key: dc-13-${{ runner.os }}-${{ github.run_id }}
