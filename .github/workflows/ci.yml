name: Secure API CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE_DIR: .ci-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: mkdir -p .ci-reports
      - name: Automated tests
        run: python -m pytest -v --junitxml=.ci-reports/pytest.xml
      - name: Real HTTP tests with curl
        run: python scripts/curl_smoke.py
      - name: Bandit SAST
        if: ${{ !cancelled() }}
        run: bandit -r secure_api -f json -o .ci-reports/bandit.json
      - name: Supplementary Python dependency audit
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt -f json -o .ci-reports/pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-and-sast-reports
          path: |
            .ci-reports/pytest.xml
            .ci-reports/curl.json
            .ci-reports/bandit.json
            .ci-reports/pip-audit.json
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # NVD's CVE API requires an API key. Without this repository secret the
      # scan aborts with "Invalid API Key" / "No documents exist". Request a free
      # key at https://nvd.nist.gov/developers/request-an-api-key and add it as
      # the repository secret NVD_API_KEY.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the exact runtime dependency artifacts
        run: python -m pip download -r requirements.txt --dest .scan-packages
      - name: Install OWASP Dependency-Check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/dc.zip" https://github.com/dependency-check/DependencyCheck/releases/download/v13.0.0/dependency-check-13.0.0-release.zip
          unzip -q "$RUNNER_TEMP/dc.zip" -d "$RUNNER_TEMP/dc"
      - uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: dc-13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dc-13-${{ runner.os }}-
      - name: OWASP Dependency-Check SCA
        shell: bash
        run: |
          set -uo pipefail
          # Fail with a readable message instead of a tool-level NvdApiException
          # when the repository secret has not been configured.
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "::error::NVD_API_KEY is empty. Add the repository secret NVD_API_KEY."
            exit 1
          fi
          # A pasted key may carry a trailing newline or the wrong length; check the
          # shape without ever printing the value.
          if ! printf '%s' "$NVD_API_KEY" | grep -Eq '^[0-9a-fA-F]{32}(-[0-9a-fA-F]{8})?$'; then
            echo "::warning::NVD_API_KEY does not match the expected 32-hex (optionally 8-hex-suffixed) shape; length is ${#NVD_API_KEY} characters."
          fi
          set +e
          "$RUNNER_TEMP/dc/dependency-check/bin/dependency-check.sh" \
            --project secure-api-lab --scan .scan-packages \
            --enableExperimental --disableOssIndex \
            --nvdApiKey "$NVD_API_KEY" \
            --data .dependency-check-data --out .ci-reports/dependency-check \
            --format HTML --format JSON --failOnCVSS 7 > dc.log 2>&1
          status=$?
          set -e
          tail -n 25 dc.log
          # Surface the tool's own error text in the run annotations, so the failure
          # is diagnosable without downloading the job log.
          while IFS= read -r line; do
            echo "::error::${line}"
          done < <(grep -iE 'error|exception|invalid|unable|denied' dc.log | tail -n 6)
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-reports
          path: .ci-reports/dependency-check/
          if-no-files-found: warn
